<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد النكات العشوائية | Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        select:hover, button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        select {
            flex: 1;
            min-width: 150px;
        }

        .joke-display {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .joke-text {
            font-size: 1.2em;
            line-height: 1.6;
            color: #333;
            margin-bottom: 15px;
        }

        .punchline {
            font-size: 1.1em;
            font-weight: bold;
            color: #764ba2;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px dashed #667eea;
            animation: punchlineAppear 0.5s ease-out 0.3s both;
        }

        @keyframes punchlineAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: shake 0.3s ease-in-out;
        }

        .error-message.active {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 150px;
            font-size: 0.95em;
            padding: 10px 15px;
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #e0e0e0;
        }

        .action-buttons button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
        }

        .stats strong {
            color: #667eea;
            font-size: 1.2em;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed !important;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            select {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 مولّد النكات</h1>
        <p class="subtitle">Random Joke Generator</p>

        <div class="error-message" id="errorMessage"></div>

        <div class="controls">
            <select id="categorySelect">
                <option value="any">أي - Any</option>
                <option value="general">عامة - General</option>
                <option value="programming">برمجة - Programming</option>
                <option value="knock-knock">الطرق - Knock-Knock</option>
            </select>
            <button id="newJokeBtn" class="main-btn">احصل على نكتة جديدة</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري التحميل...</p>
        </div>

        <div class="joke-display" id="jokeDisplay">
            <div class="joke-text" id="jokeText">انقر على "احصل على نكتة جديدة" لتبدأ</div>
            <div class="punchline" id="punchline" style="display: none;"></div>
        </div>

        <div class="action-buttons">
            <button id="copyBtn">📋 نسخ</button>
            <button id="shareBtn">📤 شارك</button>
        </div>

        <div class="stats">
            نكات مشاهدة: <strong id="jokeCount">0</strong>
        </div>
    </div>

    <script src="joke-script.js"></script>
</body>
</html>
